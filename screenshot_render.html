<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: linear-gradient(135deg, #1a2a1f 0%, #2d1f15 100%);
    min-height: 100vh;
    font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
    padding: 40px;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .note {
    width: 290px;
    border-radius: 14px;
    overflow: hidden;
    background: rgba(250, 241, 221, 0.96);
    box-shadow:
      0 2px 8px rgba(60, 40, 20, 0.08),
      0 16px 48px rgba(60, 40, 20, 0.4),
      inset 0 1px 0 rgba(255, 255, 255, 0.5);
    border: 1px solid rgba(255, 250, 235, 0.4);
  }
  .header {
    height: 50px;
    display: flex;
    align-items: center;
    padding: 0 12px 0 16px;
    background: rgba(244, 232, 208, 0.94);
    border-bottom: 1px solid rgba(60, 40, 20, 0.08);
  }
  .date {
    font-size: 14px;
    font-weight: 600;
    color: #3a2e1f;
    flex: 1;
  }
  .min-btn {
    width: 26px; height: 26px;
    border-radius: 13px;
    color: #9c8a72;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }
  .mood-bar {
    height: 44px;
    display: flex;
    align-items: center;
    padding: 4px 12px;
    gap: 10px;
    background: rgba(244, 232, 208, 0.94);
    border-bottom: 1px solid rgba(60, 40, 20, 0.08);
  }
  .mood-btn {
    width: 32px; height: 32px;
    border-radius: 16px;
    background: rgba(140, 100, 50, 0.07);
    border: 1.5px solid #A87C4A;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .slogan {
    font-family: 'Segoe Print', cursive;
    font-style: italic;
    font-size: 12px;
    color: #3a2e1f;
    border-bottom: 1.5px solid #A87C4A;
    flex: 1;
    padding: 4px 2px;
  }
  .list {
    padding: 6px 4px;
    background: rgba(250, 241, 221, 0.96);
  }
  .item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 12px;
    border-radius: 8px;
  }
  .item:hover { background: rgba(140, 100, 50, 0.07); }
  .priority-dot {
    width: 12px; height: 12px;
    border-radius: 6px;
  }
  .checkbox {
    width: 16px; height: 16px;
    border-radius: 8px;
    border: 1.5px solid #9c8a72;
  }
  .item.done .checkbox {
    background: #9c8a72;
    border-color: #9c8a72;
    position: relative;
  }
  .item.done .checkbox::after {
    content: "";
    position: absolute;
    top: 3px; left: 4px;
    width: 5px; height: 8px;
    border-right: 1.5px solid #FAF1DD;
    border-bottom: 1.5px solid #FAF1DD;
    transform: rotate(45deg);
  }
  .text { font-size: 13px; color: #3a2e1f; flex: 1; }
  .item.done .text { color: #c4b59a; text-decoration: line-through; }
  .input-area { padding: 6px 12px 8px; background: rgba(250, 241, 221, 0.96); }
  .input-area input {
    width: 100%;
    padding: 7px 11px;
    background: rgba(255, 250, 235, 0.7);
    color: #3a2e1f;
    border: 1px solid rgba(60, 40, 20, 0.1);
    border-radius: 8px;
    font-size: 12px;
    outline: none;
    font-family: inherit;
  }
  .footer {
    height: 26px;
    padding: 0 14px;
    background: rgba(244, 232, 208, 0.94);
    display: flex;
    align-items: center;
    border-top: 1px solid rgba(60, 40, 20, 0.08);
    font-size: 10px;
    color: #9c8a72;
  }
  .footer .legend {
    display: flex; gap: 4px;
    align-items: center;
    margin-left: auto;
    margin-right: 8px;
  }
  .legend-dot { width: 6px; height: 6px; border-radius: 4px; }
  .hotkey {
    font-size: 9px;
    color: #c4b59a;
    font-family: 'SF Mono', Consolas, monospace;
  }
</style>
</head>
<body>
  <div class="note">
    <div class="header">
      <div class="date">04月27日 周一</div>
      <div class="min-btn">—</div>
    </div>
    <div class="mood-bar">
      <div class="mood-btn">🚀</div>
      <div class="slogan">今天搞钱不搞情绪</div>
    </div>
    <div class="list">
      <div class="item"><div class="priority-dot" style="background:#C75450"></div><div class="checkbox"></div><div class="text">下午3点回呱哥微信</div></div>
      <div class="item done"><div class="priority-dot" style="background:#D99850"></div><div class="checkbox"></div><div class="text">复盘 PLTR 持仓</div></div>
      <div class="item"><div class="priority-dot" style="background:#D99850"></div><div class="checkbox"></div><div class="text">和阿丸对接训练营</div></div>
      <div class="item done"><div class="priority-dot" style="background:#7D92A8"></div><div class="checkbox"></div><div class="text">买猫粮</div></div>
      <div class="item"><div class="priority-dot" style="background:#C75450"></div><div class="checkbox"></div><div class="text">写 P6 蒸馏漏斗周报</div></div>
      <div class="item"><div class="priority-dot" style="background:#7D92A8"></div><div class="checkbox"></div><div class="text">预约下周牙医</div></div>
    </div>
    <div class="input-area">
      <input type="text" placeholder="添加新待办,回车确认...">
    </div>
    <div class="footer">
      <span>本周 8/15 (53%)</span>
      <div class="legend">
        <div class="legend-dot" style="background:#C75450"></div>高
        <div class="legend-dot" style="background:#D99850"></div>中
        <div class="legend-dot" style="background:#7D92A8"></div>低
      </div>
      <span class="hotkey">Ctrl+Alt+N</span>
    </div>
  </div>
</body>
</html>
